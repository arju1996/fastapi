name: build and deploy code

on: 
  push:
    branches:
      - "main"
    tags: 
      - "v*"

jobs:
  test:
    environment:
      name: testing
    env:
      DATABASE_HOSTNAME: ${{secrets.DATABASE_HOSTNAME}}
      DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_PORT: ${{secrets.DATABASE_PORT}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      DATABASE_URL: ${{secrets.DUMMY}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: ${{secrets.DATABASE_NAME}}_test
          POSTGRES_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    runs-on: ubuntu-24.04
    steps:
      - name: "pulling git repo"
        uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with: 
          version: "0.12.15"
      - name: "install python"
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
          # python-version-file: "pyproject.toml"
      - name: install the deps
        run:  uv sync --locked --all-extras --dev

      - name: run tests
        run: uv run pytest -x -v --disable-warnings
  
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: "pulling git repo"
        uses: actions/checkout@v7
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/fastapi
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}}
          password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  deploy-ubuntu:
    runs-on: ubuntu-24.04
    needs: [build]
    environment:
      name: production
    steps:
      - name: deploy to ubuntu
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_UBUNTU_HOST }}
          username: ${{ secrets.PROD_UBUNTU_USERNAME }}
          password: ${{ secrets.PROD_UBUNTU_PASSWORD }}
          script: |
            cd app/src
            git pull
            echo ${{ secrets.PROD_UBUNTU_PASSWORD }} | sudo -S systemctl restart api

  deploy-docker:
    runs-on: ubuntu-24.04
    needs: [build]
    environment:
      name: production
    steps:
      - name: copy docker compose to docker system
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DOCKER_DEPLOY_HOST }}
          username: ${{ secrets.DOCKER_DEPLOY_USERNAME }}
          password: ${{ secrets.DOCKER_DEPLOY_PASSWORD }}
          source: "docker-compose_prod.yml"
          target: "app"
      - name: compose up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DOCKER_DEPLOY_HOST }}
          username: ${{ secrets.DOCKER_DEPLOY_USERNAME }}
          password: ${{ secrets.DOCKER_DEPLOY_PASSWORD }}
          script: |
            docker compose -f app/docker-compose_prod.yml pull
            docker compose -f app/docker-compose_prod.yml up -d